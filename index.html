<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEMAWUSI VENTURES — Live Cloud</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* ====== STYLES (same as before, compacted) ====== */
:root{
  --bg:#EEF1F2; --surface:#FFF; --surface-2:#F7F8F9; --sidebar:#141B24; --sidebar-2:#1D2733;
  --ink:#161C22; --ink-soft:#5B6672; --ink-faint:#8A939C; --border:#DCE1E4; --border-soft:#EAEDEF;
  --primary:#2F6690; --primary-dark:#204A69; --primary-light:#E7F0F6; --aluminium:#AEB6BD;
  --success:#25795A; --success-bg:#E5F3ED; --warning:#A9670D; --warning-bg:#FBF1DD;
  --danger:#B23A3A; --danger-bg:#FBEAEA; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(20,27,36,.06), 0 6px 20px -8px rgba(20,27,36,.12);
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;letter-spacing:.2px;margin:0;}
button{font-family:inherit;cursor:pointer;} input,select,textarea{font-family:inherit;font-size:14px;}
.brushed{background:linear-gradient(115deg,#B9C1C7 0%,#DDE2E5 8%,#9AA3AA 16%,#C7CDD2 24%,#8E979E 32%,#D7DCDF 42%,#A3ACB3 52%,#C3C9CD 62%,#949CA3 72%,#D2D7DA 82%,#A9B1B7 92%,#C6CCD0 100%);background-size:200% 100%;}
#app{display:flex;min-height:100vh;}
#sidebar{width:236px;flex:0 0 236px;background:var(--sidebar);color:#C9D0D6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;}
#sidebar .brushed{height:4px;flex:0 0 4px;}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:22px;color:#fff;letter-spacing:.5px;line-height:1.1;}
.brand-sub{font-size:11px;color:var(--aluminium);margin-top:4px;letter-spacing:.4px;text-transform:uppercase;}
nav.mainnav{flex:1;padding:14px 10px;overflow-y:auto;}
#branchSwitcher{padding:12px 14px 4px;}
.branch-switch{display:flex;flex-direction:column;gap:6px;}
.branch-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,.12);background:var(--sidebar-2);color:#C9D0D6;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;text-align:left;transition:background .12s,border-color .12s;}
.branch-btn:hover{background:#26313E;}
.branch-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.branch-btn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6;flex:0 0 7px;}
.branch-locked-label{padding:9px 10px;border:1px solid rgba(255,255,255,.12);background:var(--sidebar-2);color:#C9D0D6;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;}
.branch-btn.active .dot{opacity:1;}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:transparent;color:#C9D0D6;border-radius:var(--radius-sm);font-size:14px;font-weight:500;margin-bottom:2px;text-align:left;transition:background .12s,color .12s;}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85;}
.nav-item:hover{background:var(--sidebar-2);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;}
#sidebar-footer{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:var(--ink-faint);}
#sidebar-footer .dev{color:var(--aluminium);font-weight:600;margin-top:2px;}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{height:60px;flex:0 0 60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30;}
#topbar .page-title{font-family:var(--font-display);font-size:22px;font-weight:600;}
#topbar .right{display:flex;align-items:center;gap:14px;}
.status-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);padding:5px 10px;border:1px solid var(--border);border-radius:999px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);}
.status-pill.offline .status-dot{background:var(--ink-faint);}
#menuToggle{display:none;background:none;border:0;padding:6px;}
#menuToggle svg{width:22px;height:22px;color:var(--ink);}
#view{padding:22px;max-width:1400px;width:100%;margin:0 auto;}

/* components */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.card .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.card .value{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;}
.card .value.warn{color:var(--warning);}
.card .value.bad{color:var(--danger);}
.card .value.good{color:var(--success);}
.card .sub{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:18px;}
.panel-body{padding:16px 18px;}
.panel-toolbar{padding:12px 18px;border-bottom:1px solid var(--border-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface-2);}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;transition:background .12s,border-color .12s;white-space:nowrap;}
.btn:hover{background:var(--surface-2);border-color:var(--aluminium-dark);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
.btn-danger{background:var(--danger-bg);border-color:#EFC9C9;color:var(--danger);}
.btn-danger:hover{background:#F6D8D8;}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.icon-btn{border:0;background:transparent;color:var(--ink-soft);padding:5px;border-radius:6px;display:inline-flex;}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
.icon-btn svg{width:16px;height:16px;}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
.field{margin-bottom:12px;}
.field-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);padding:10px 12px;border-bottom:2px solid var(--border);white-space:nowrap;background:var(--surface-2);}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
.num,.mono{font-family:var(--font-mono);}
.right{text-align:right;}
.center{text-align:center;}
.table-wrap{overflow-x:auto;}
.empty-row td{text-align:center;color:var(--ink-faint);padding:36px 12px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px;}
.badge-ok{background:var(--success-bg);color:var(--success);}
.badge-warn{background:var(--warning-bg);color:var(--warning);}
.badge-bad{background:var(--danger-bg);color:var(--danger);}
.badge-muted{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border);}
.badge-info{background:var(--primary-light);color:var(--primary-dark);}
#modalRoot{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;z-index:100;}
#modalRoot.open{display:flex;}
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,26,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
.modal-box{background:#fff;border-radius:var(--radius);width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .14s ease-out;}
.modal-box.wide{max-width:900px;}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:19px;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:10px;}
#toastRoot{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:#1D2733;color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;max-width:320px;border-left:4px solid var(--primary);}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{border-left-color:var(--success);}
.toast.error{border-left-color:var(--danger);}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
.tabbtn{padding:9px 14px;border:0;background:transparent;font-weight:600;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;}
.tabbtn.active{color:var(--primary);border-color:var(--primary);}
.stock-bar{height:5px;border-radius:3px;background:var(--border-soft);overflow:hidden;width:64px;display:inline-block;vertical-align:middle;margin-left:6px;}
.stock-bar>span{display:block;height:100%;background:var(--success);}
.stock-bar.low>span{background:var(--danger);}
.help-box{background:var(--primary-light);border:1px solid #CFE0EA;border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;color:var(--primary-dark);margin-bottom:14px;}
.applied-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--success-bg);color:var(--success);border:1px solid #CFE0DA;border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-weight:600;}
.danger-zone{border:1px solid #EFC9C9;background:var(--danger-bg);border-radius:var(--radius);padding:16px;}
#printArea{display:none;}
@media print{body>*:not(#printArea){display:none !important;}#printArea{display:block !important;}}
@media (max-width:900px){#sidebar{position:fixed;left:-260px;top:0;transition:left .18s ease;box-shadow:0 0 0 rgba(0,0,0,0);}#sidebar.open{left:0;box-shadow:20px 0 40px rgba(0,0,0,.25);}#menuToggle{display:inline-flex;}#view{padding:16px;}.modal-box{max-width:100%;}}
.overlay-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;}
.overlay-scrim.show{display:block;}
#loginScreen{position:fixed;inset:0;background:var(--sidebar);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
#loginScreen.hidden{display:none;}
.login-card{background:#fff;border-radius:var(--radius);width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;}
.login-card .brushed{height:5px;}
.login-card-body{padding:30px 28px 26px;}
.login-card .brand-name{color:var(--ink);font-size:26px;}
.login-card .brand-sub{color:var(--ink-soft);margin-bottom:20px;}
.login-error{background:var(--danger-bg);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:var(--radius-sm);margin-bottom:12px;display:none;}
.login-error.show{display:block;}
.login-hint{font-size:11.5px;color:var(--ink-faint);margin-top:16px;text-align:center;line-height:1.5;}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;}
.user-chip:hover{background:var(--surface-2);}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-display);}
.user-chip .uname{font-size:12.5px;font-weight:600;}
.user-chip .urole{font-size:10px;color:var(--ink-faint);text-transform:uppercase;}
.receipt-doc{font-family:var(--font-mono);font-size:12px;max-width:300px;margin:0 auto;color:#111;}
.receipt-doc .rc-center{text-align:center;}
.receipt-doc .rc-title{font-size:15px;font-weight:700;font-family:var(--font-display);}
.receipt-doc hr{border:none;border-top:1px dashed #999;margin:8px 0;}
.receipt-doc .rline{display:flex;justify-content:space-between;gap:8px;padding:2px 0;}
.receipt-doc .rline.grand{font-weight:700;font-size:13px;border-top:1px dashed #999;margin-top:4px;padding-top:6px;}
.receipt-doc .ritem{margin-bottom:3px;}
.receipt-doc .ritem .rline{color:#333;}
@media print{body.printing-receipt #printArea{width:80mm;margin:0 auto;}}
</style>

<script>
// ================================================================
//  1. REPLACE THIS WITH YOUR FIREBASE CONFIG
// ================================================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// ================================================================
//  2. INIT FIREBASE
// ================================================================
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ================================================================
//  3. CONSTANTS (copied from original app)
// ================================================================
const CATEGORIES = [
  "Cement","Iron Rods & Reinforcement","Blocks & Bricks","Roofing Sheets & Accessories",
  "Timber & Wood Products","Tiles","Sand, Stone & Aggregates","Plumbing Materials & Pipes",
  "Electrical Materials","Paints, Chemicals & Wood Treatment","Nails, Screws & Fasteners",
  "Adhesives & Sealants","Doors, Windows & Fittings","Aluminium & Glass Products",
  "Hardware & Tools","Other"
];
const UNITS = ["Piece","Bag","Kg","Ton","Litre","Meter","Length","Sheet","Bundle","Roll","Box","Set","Trip","Bucket","Tin","Yard","BDL","Coil","Carton","Pcs"];
const PAYMENT_METHODS = ["Cash","Bank Transfer","Mobile Money","Cheque","Split (Cash + Mobile Money)","Credit (Unpaid)"];
const EXPENSE_CATEGORIES = ["Transport","Daily Allowance (Workers)","Wages / Labour","Loading & Offloading","Fuel","Rent","Utilities","Repairs","Store Supplies","Communication","Bank Charges","Miscellaneous"];
const EXPENSE_PAYMENT_METHODS = ["Cash","Bank Transfer","Mobile Money","Cheque"];
const SESSION_KEY = "elemawusi_session_user";
const BRANCH_KEY = "elemawusi_session_branch";
const BRANCHES = { main: {id:'main', name:'Main Shop'}, annex: {id:'annex', name:'ELEMAWUSI ANNEX'} };
let STATE = {
  products: [], sales: [], priceHistory: [], stockLog: [], expenditures: [], stockTransport: [], deliveries: [],
  internalUsage: [], settings: null, users: [], deposits: [], stockTransfers: [], supplies: [], customerCredits: [],
  currentUser: null, currentBranch: 'main', tab: 'dashboard', salesSubView: 'list', saleDraft: null,
  suppliesSubView: 'list', supplyDraft: null, supplyExchangeDraft: null, rowSeq: 1
};
function inBranch(x){ return (x.branch||'main')===STATE.currentBranch; }
function branchName(id){ return BRANCHES[id||'main']?.name || 'Main Shop'; }

// ================================================================
//  4. UTILITY
// ================================================================
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money(n){ return (STATE.settings?.currencySymbol||'GH₵') + ' ' + fmtNum(n); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(s){ const d=new Date(s); return d.toLocaleString(); }
function uid(){ return STATE.rowSeq++; }
function byId(id){ return document.getElementById(id); }
function toast(msg,type='success'){
  const t=document.createElement('div'); t.className=`toast ${type}`; t.textContent=msg;
  byId('toastRoot').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),300);},2600);
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

// ================================================================
//  5. FIRESTORE HELPERS (CRUD wrappers)
// ================================================================
function getCollection(collection){
  return db.collection(collection);
}
async function getAllDocs(collection){
  const snapshot = await getCollection(collection).get();
  const docs = [];
  snapshot.forEach(doc=>docs.push({id:doc.id, ...doc.data()}));
  return docs;
}
async function addDoc(collection, data){
  const ref = await getCollection(collection).add(data);
  return ref.id;
}
async function updateDoc(collection, id, data){
  await getCollection(collection).doc(id).update(data);
}
async function deleteDoc(collection, id){
  await getCollection(collection).doc(id).delete();
}

// ================================================================
//  6. AUTH (plain text for demo – stores users in Firestore)
// ================================================================
async function ensureUsers(){
  const snapshot = await getCollection('users').get();
  if(snapshot.empty){
    await addDoc('users', {username:'admin', password:'admin123', fullName:'System Admin', role:'admin', branch:'main', active:true, createdAt:new Date().toISOString()});
    await addDoc('users', {username:'annexadmin', password:'annex123', fullName:'Annex Admin', role:'admin', branch:'annex', active:true, createdAt:new Date().toISOString()});
  }
}
async function refreshAll(){
  STATE.products = await getAllDocs('products');
  STATE.products.sort((a,b)=>a.name.localeCompare(b.name));
  STATE.sales = await getAllDocs('sales');
  STATE.sales.sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id-a.id);
  STATE.priceHistory = await getAllDocs('priceHistory');
  STATE.priceHistory.sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id-a.id);
  STATE.stockLog = await getAllDocs('stockLog');
  STATE.stockLog.sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id-a.id);
  STATE.expenditures = await getAllDocs('expenditures');
  STATE.expenditures.sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id-a.id);
  STATE.stockTransport = await getAllDocs('stockTransport');

function normalizeCustomerText(v){ return String(v||'').trim().toLowerCase().replace(/\s+/g,' '); }
function normalizePhone(v){ return String(v||'').replace(/[^\d+]/g,''); }
function customerCreditKey(name, phone){
  const n = normalizeCustomerText(name), p = normalizePhone(phone);
  if(!n && !p) return '';
  return `${n}::${p}`;
}
function findCustomerCreditAccount(name, phone, branch=STATE.currentBranch){
  const key = customerCreditKey(name, phone);
  if(!key) return null;
  return STATE.customerCredits.find(c=> (c.branch||'main')===branch && c.customerKey===key) || null;
}
function approvedCreditTotal(account){
  return Number(account?.baseLimit||0) + (account?.topups||[]).reduce((a,t)=>a+Number(t.amount||0),0);
}
function customerOutstandingTotal(name, phone, branch=STATE.currentBranch, excludeSaleId=null){
  const key = customerCreditKey(name, phone);
  if(!key) return 0;
  return STATE.sales.filter(s=> (s.branch||'main')===branch && s.status!=='void' && customerCreditKey(s.customerName, s.customerPhone)===key && (excludeSaleId==null || s.id!=excludeSaleId))
    .reduce((a,s)=> a + Math.max(0, Number(s.balance||0)), 0);
}
function getCustomerCreditSummary(name, phone, branch=STATE.currentBranch, excludeSaleId=null){
  const account = findCustomerCreditAccount(name, phone, branch);
  const approved = approvedCreditTotal(account);
  const used = customerOutstandingTotal(name, phone, branch, excludeSaleId);
  const available = approved - used;
  const topupTotal = (account?.topups||[]).reduce((a,t)=>a+Number(t.amount||0),0);
  return {key: customerCreditKey(name, phone), account, approved, used, available, topupTotal};
}
function supplySettlementSummary(rec){
  const invoice = Number(rec?.amount||0);
  const paid = Number(rec?.amountPaid!=null ? rec.amountPaid : invoice);
  const balance = invoice - paid;
  if(Math.abs(balance)<=0.009) return {invoice, paid, balance:0, status:'Settled'};
  if(balance>0) return {invoice, paid, balance, status:'Outstanding'};
  return {invoice, paid, balance, status:'Overpaid'};
}
function saleRefundedAmount(sale){ return (sale.refunds||[]).reduce((a,r)=>a+Number(r.amount||0),0); }
function refundedQtyForSaleProduct(sale, productId){ return (sale.refunds||[]).reduce((a,r)=> a + (r.items||[]).filter(it=>String(it.productId)===String(productId)).reduce((b,it)=>b+Number(it.qty||0),0), 0); }
function refundableQtyForSaleItem(sale, item){ return Math.max(0, Number(item?.qty||0) - refundedQtyForSaleProduct(sale, item?.productId)); }
function refundStatusForSale(sale){ if(saleRefundedAmount(sale)<=0.009) return 'None'; return (sale.items||[]).every(it=> refundableQtyForSaleItem(sale, it)<=0.009) ? 'Full' : 'Partial'; }
function renderRefundBadge(status){ const cls = status==='Full'?'badge-ok': status==='Partial'?'badge-warn':'badge-muted'; return `<span class="badge ${cls}">${esc(status)}</span>`; }
function paymentBadge(status){ const cls = status==='Paid'?'badge-ok': status==='Partial'?'badge-warn':'badge-bad'; return `<span class="badge ${cls}">${esc(status)}</span>`; }
function depositRemaining(d){ return Math.max(0, Number(d.amount||0) - Number(d.amountUsed||0)); }
function recomputeDepositStatus(d){ if(d.status==='Refunded') return; const remaining = depositRemaining(d); if(remaining<=0.009) d.status='Fulfilled'; else if(Number(d.amountUsed||0)>0) d.status='Partially Used'; else d.status='Pending'; }

async function doLogin(){
  const errBox = byId('loginError');
  errBox.classList.remove('show');
  const btn = byId('loginBtn');
  try{
    const username = byId('login_user').value.trim();
    const password = byId('login_pass').value;
    if(!username || !password){ errBox.textContent='Enter username and password.'; errBox.classList.add('show'); return; }
    btn.disabled = true;
    await refreshAll(); // load users
    const user = STATE.users.find(u=>u.username===username && u.password===password && u.active!==false);
    if(!user){ errBox.textContent='Invalid credentials.'; errBox.classList.add('show'); return; }
    const userBranch = user.branch||'main';
    const isSuperAdmin = user.role==='admin' && userBranch==='main';
    const chosenBranch = byId('login_branch').value;
    const effectiveBranch = isSuperAdmin ? (chosenBranch && BRANCHES[chosenBranch] ? chosenBranch : 'main') : userBranch;
    STATE.currentBranch = effectiveBranch;
    localStorage.setItem(BRANCH_KEY, effectiveBranch);
    STATE.currentUser = user;
    localStorage.setItem(SESSION_KEY, user.username);
    enterApp();
  }catch(err){
    errBox.textContent = 'Error: '+err.message;
    errBox.classList.add('show');
  }finally{
    btn.disabled = false;
  }
}

async function addProduct(){

  if(!name || !price) return toast('Enter name and price','error');
  const newProd = {name, unit:byId('new-prod-unit').value||'Piece', category:'Other', sellingPrice:price, costPrice:0, stockQty:0, reorderLevel:0, branch:STATE.currentBranch, createdAt:new Date().toISOString()};

async function updateStock(productId, newVal){
  const qty = parseFloat(newVal);
  if(isNaN(qty) || qty<0) return toast('Invalid quantity','error');
  const product = STATE.products.find(p=>p.id===productId);
  if(!product) return;
  const oldQty = product.stockQty;
  product.stockQty = qty;
  await updateDoc('products', productId, {stockQty:qty});
  await addDoc('stockLog', {productId, productName:product.name, type:'manual', qty:qty-oldQty, resultingStock:qty, reason:'Manual adjustment', date:new Date().toISOString(), branch:product.branch});
  await refreshAll();
  render();
  toast('Stock updated');
}
async function deleteProduct(id){
  if(!confirm('Delete product?')) return;
  await deleteDoc('products', id);
  await refreshAll();
  render();
  toast('Product deleted');
}

async function saveSale(){
  // collect data from form and save to Firestore
  const customerName = byId('s_cust').value.trim() || 'Walk-in';
  const customerPhone = byId('s_phone').value.trim();
  const date = byId('s_date').value || todayStr();
  const paymentMethod = byId('s_pmethod').value;
  const amountPaid = parseFloat(byId('s_paid').value)||0;
  const items = [];
  // gather items from table
  document.querySelectorAll('#saleItemsBody tr').forEach(row=>{
    const prodSelect = row.querySelector('.s_prod');
    const qtyInput = row.querySelector('.s_qty');
    const priceInput = row.querySelector('.s_price');
    if(prodSelect && qtyInput && priceInput){
      const productId = prodSelect.value;
      const qty = parseFloat(qtyInput.value)||0;
      const unitPrice = parseFloat(priceInput.value)||0;
      if(productId && qty>0 && unitPrice>0){
        const prod = STATE.products.find(p=>p.id===productId);
        if(prod){
          items.push({productId, name:prod.name, unit:prod.unit, qty, unitPrice, lineTotal:qty*unitPrice});
          // deduct stock
          prod.stockQty -= qty;
          updateDoc('products', prod.id, {stockQty: prod.stockQty});
        }
      }
    }
  });
  if(items.length===0) return toast('Add at least one item','error');
  const subtotal = items.reduce((a,i)=>a+i.lineTotal,0);
  const discount = 0;
  const tax = 0;
  const deliveryFee = 0;
  const grandTotal = subtotal - discount + tax + deliveryFee;
  const balance = grandTotal - amountPaid;
  const paymentStatus = balance<=0 ? 'Paid' : (amountPaid>0 ? 'Partial' : 'Unpaid');
  const invoiceNo = STATE.settings.invoicePrefix + (STATE.settings.invoiceCounter++).toString().padStart(4,'0');
  await updateDoc('settings', 'main', {invoiceCounter: STATE.settings.invoiceCounter});
  const saleData = {
    invoiceNo, customerName, customerPhone, date, items, subtotal, discount, tax, deliveryFee, grandTotal,
    amountPaid, balance, paymentStatus, paymentMethod, status:'completed', createdBy: STATE.currentUser.username,
    createdByName: STATE.currentUser.fullName, branch: STATE.currentBranch, createdAt: new Date().toISOString()
  };
  await addDoc('sales', saleData);
  await refreshAll();
  STATE.salesSubView='list';
  render();
  toast('Sale saved!');

// ================================================================
//  14. INIT
// ================================================================
async function init(){
  byId('yearNow').textContent = new Date().getFullYear();
  bindAuthEvents();
  bindGlobalEvents();
  try{
    await ensureSettings();
    await ensureUsers();
    await refreshAll();
    const savedUser = localStorage.getItem(SESSION_KEY);
    const user = STATE.users.find(u=>u.username===savedUser && u.active!==false);
    if(user){
      STATE.currentUser = user;
      const savedBranch = localStorage.getItem(BRANCH_KEY);
      STATE.currentBranch = (savedBranch && BRANCHES[savedBranch]) ? savedBranch : (user.branch||'main');
      enterApp();
    } else {
      showLogin();
    }
  }catch(err){
    console.error(err);
    showLogin();
    byId('loginError').textContent = 'Error: '+err.message;
    byId('loginError').classList.add('show');
  }
}
function bindAuthEvents(){
  byId('loginBtn').addEventListener('click', doLogin);
  byId('login_pass').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });
  byId('login_user').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });
  byId('logoutBtn').addEventListener('click', logoutUser);
}
function bindGlobalEvents(){
  byId('menuToggle').addEventListener('click', ()=> byId('sidebar').classList.contains('open') ? closeSidebar() : openSidebar());
  byId('scrim').addEventListener('click', closeSidebar);
  document.addEventListener('click', (e)=>{
    const goNew = e.target.closest('[data-action="go-new-sale"]');
    if(goNew){ navigate('sales'); openSaleBuilder(null); return; }
    const closeBtn = e.target.closest('[data-action="closeModal"]');
    if(closeBtn){ closeModal(); return; }
  });
  byId('modalRoot').addEventListener('click', (e)=>{
    if(e.target.id==='modalRoot' || e.target.classList.contains('modal-overlay')) closeModal();
  });
}
function openModal(title, bodyHtml, footerHtml, wide){
  byId('modalRoot').innerHTML = `<div class="modal-overlay"><div class="modal-box ${wide?'wide':''}"><div class="modal-header"><h3>${esc(title)}</h3><button class="icon-btn" data-action="closeModal">✕</button></div><div class="modal-body">${bodyHtml}</div>${footerHtml? `<div class="modal-footer">${footerHtml}</div>` : ''}</div></div>`;
  byId('modalRoot').classList.add('open');
}
function closeModal(){ byId('modalRoot').classList.remove('open'); byId('modalRoot').innerHTML=''; }

// ================================================================
//  BOOT
// ================================================================
init();
